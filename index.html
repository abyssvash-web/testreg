<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astral Ymir - Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <div class="card">
      <h1 class="brand-title">ASTRAL YMIR</h1>
      <p class="sub-title">Create Account</p>

      <form id="registerForm">
        <!-- Referral Code Display / Input -->
        <div class="form-group">
          <div class="referral-box">
            <span>Referral Code: </span>
            <strong id="referralDisplay">None</strong>
          </div>
          <!-- Hidden input para sa form submission -->
          <input type="hidden" id="promoCode" name="promoCode">
        </div>

        <div class="form-group">
          <label for="username">Account/Username</label>
          <input type="text" id="username" name="username" required minlength="3" maxlength="32">
          <span class="hint">3–32 characters: letters, numbers and underscore</span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
