<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google reCAPTCHA Script -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <div class="background-container">
    <div class="card">
      <h2>Create account</h2>
      
      <form id="registerForm">
        <!-- Hidden input para sa Referral ID mula sa URL -->
        <input type="hidden" id="referralCode" name="referralCode">

        <div class="form-group">
          <label>Account <span class="required">*</span></label>
          <input type="text" id="username" placeholder="(6-10) letters, numbers" required minlength="6" maxlength="10">
        </div>

        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" id="password" placeholder="(6-14) letters, numbers, symbols" required minlength="6" maxlength="14">
        </div>

        <div class="form-group">
          <label>Re-enter password <span class="required">*</span></label>
          <input type="password" id="confirmPassword" placeholder="input" required>
        </div>

        <div class="form-group">
          <label>Security Question <span class="required">*</span></label>
          <select id="securityQuestion" required>
            <option value="" disabled selected>select</option>
            <option value="pet">What is the name of your first pet?</option>
            <option value="school">What primary school did you attend?</option>
            <option value="city">In what city were you born?</option>
          </select>
        </div>

        <div class="form-group">
          <label>Security Answer <span class="required">*</span></label>
          <input type="text" id="securityAnswer" placeholder="input" required>
        </div>

        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <div class="input-with-select">
            <input type="text" id="emailUser" placeholder="input" required>
            <select id="emailDomain">
              <option value="@gmail.com">@gmail.com</option>
              <option value="@yahoo.com">@yahoo.com</option>
              <option value="@hotmail.com">@hotmail.com</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Email Code <span class="required">*</span></label>
          <div class="input-with-button">
            <input type="text" id="emailCode" placeholder="input" required>
            <button type="button" class="btn-send-mail">Send Mail</button>
          </div>
        </div>

        <!-- Google reCAPTCHA Box -->
        <div class="form-group captcha-container">
          <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
        </div>

        <button type="submit" class="btn-submit">Continue</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
